name: Deploy to WordPress.org SVN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-secrets:
    name: Check WordPress.org SVN Secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -n "$SVN_USERNAME" ] && [ -n "$SVN_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SVN_USERNAME / SVN_PASSWORD secrets not set yet — skipping WordPress.org SVN deploy until plugin is approved."
          fi

  deploy:
    name: Publish Release & Artwork to WordPress.org
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: libertydev-site-migrator
          ASSETS_DIR: .wordpress-org
